[project]
name = "tridi"
version = "2.11.0"
description = "Point cloud, mesh and STEP viewer: tridi.show() instead of Open3D's draw_geometries"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Rocco Caccioppoli", email = "caccioppolirocco@gmail.com" }]
dependencies = ["numpy"]
keywords = ["point-cloud", "pcd", "mesh", "viewer", "step", "open3d"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/rccnroll/tridi"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tridi = "tridi.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tridi"]
# the binary and OpenCASCADE, put there by packaging/wheel/build.sh
artifacts = ["tridi/_bin/**"]
