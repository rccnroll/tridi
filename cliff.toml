# git-cliff: CHANGELOG.md and the release notes, from the Conventional Commits

[changelog]
header = """
# Changelog

What changed in each release, generated by [git-cliff](https://git-cliff.org)
from the commit messages. The why is in [ROADMAP.md](ROADMAP.md).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^docs\\(roadmap\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(ci|build)", group = "<!-- 6 -->Build and CI" },
  { message = "^(chore|style)", group = "<!-- 7 -->Other" },
]
tag_pattern = "v[0-9].*"
