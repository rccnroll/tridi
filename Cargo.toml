[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.11.0"
edition = "2024"
# egui 0.34 (the legend, through three-d) needs 1.92; CI checks it
rust-version = "1.92"
authors = ["Rocco Caccioppoli <caccioppolirocco@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rccnroll/tridi"
homepage = "https://github.com/rccnroll/tridi"

# every third-party dependency once, with its features
[workspace.dependencies]
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland", "x11"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
# no "window": it pins winit 0.28, whose title bar GNOME at scale 2 rejects
three-d = { version = "0.19", default-features = false, features = ["egui-gui"] }
three-d-asset = { version = "0.10", features = ["gltf", "obj", "stl", "data-url", "png", "jpeg"] }
winit = "0.30"
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"
clap_complete = "4.6.11"
thiserror = "2"
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
# the picks copied to the clipboard (Wayland through data-control, else X11)
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
cc = "1.2"
tridi-formats = { path = "crates/tridi-formats", version = "2.11.0" }
tridi-step = { path = "crates/tridi-step", version = "2.11.0" }
# each member names the features it wants
tridi = { path = "crates/tridi", version = "2.11.0", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1

# The lint policy: no panics, no silent
# casts, no unexplained exceptions; the only escape is a scoped
# #[expect(lint, reason = "...")].
[workspace.lints.rust]
unused_must_use = "deny"
unused_imports  = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

# override in pedantic
missing_errors_doc                   = "allow"
must_use_candidate                   = "deny"

# individual items from the `restrictions` group

absolute_paths                       = "warn"
allow_attributes                     = "deny"
allow_attributes_without_reason      = "deny"
as_conversions                       = "deny"
assertions_on_result_states          = "deny"
cfg_not_test                         = "deny"
clone_on_ref_ptr                     = "warn"
create_dir                           = "deny"
dbg_macro                            = "warn"
doc_include_without_cfg              = "deny"
else_if_without_else                 = "allow"
empty_drop                           = "deny"
empty_enum_variants_with_brackets    = "deny"
empty_structs_with_brackets          = "deny"
error_impl_error                     = "warn"
exit                                 = "deny"
expect_used                          = "deny"
field_scoped_visibility_modifiers    = "allow"
filetype_is_file                     = "warn"
float_cmp_const                      = "deny"
if_then_some_else_none               = "deny"
implicit_clone                       = "warn"
impl_trait_in_params                 = "warn"
indexing_slicing                     = "deny"
infinite_loop                        = "deny"
integer_division                     = "warn"
items_after_test_module              = "allow"
iter_over_hash_type                  = "warn"
large_include_file                   = "warn"
let_underscore_must_use              = "warn"
lossy_float_literal                  = "warn"
map_err_ignore                       = "warn"
map_with_unused_argument_over_ranges = "warn"
mem_forget                           = "deny"
missing_assert_message               = "warn"
missing_docs_in_private_items        = "allow"
module_name_repetitions              = "allow"
mutex_atomic                         = "deny"
mutex_integer                        = "deny"
non_zero_suggestions                 = "warn"
panic                                = "deny"
partial_pub_fields                   = "warn"
pathbuf_init_then_push               = "warn"
print_stdout                         = "deny"
pub_use                              = "allow"
pub_without_shorthand                = "warn"
rc_buffer                            = "warn"
rc_mutex                             = "warn"
redundant_test_prefix                = "deny"
redundant_type_annotations           = "warn"
renamed_function_params              = "warn"
rest_pat_in_fully_bound_structs      = "warn"
return_and_then                      = "warn"
same_name_method                     = "deny"
string_lit_chars_any                 = "deny"
string_slice                         = "warn"
str_to_string                        = "deny"
tests_outside_test_module            = "deny"
todo                                 = "deny"
undocumented_unsafe_blocks           = "deny"
unimplemented                        = "deny"
unnecessary_safety_comment           = "warn"
unnecessary_safety_doc               = "warn"
unneeded_field_pattern               = "deny"
unreachable                          = "deny"
unseparated_literal_suffix           = "deny"
unused_result_ok                     = "warn"
unwrap_in_result                     = "deny"
unwrap_used                          = "deny"
use_debug                            = "warn"
verbose_file_reads                   = "warn"
wildcard_enum_match_arm              = "warn"
doc_overindented_list_items          = "allow"

