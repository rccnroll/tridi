[package]
name = "tridi"
version = "2.6.0"
edition = "2024"
# egui 0.34 (the legend, through three-d) needs 1.92; CI checks it
rust-version = "1.92"
description = "Viewer for point clouds, meshes and STEP, with Nautilus thumbnails"
authors = ["Rocco Caccioppoli <caccioppolirocco@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rccnroll/tridi"
homepage = "https://github.com/rccnroll/tridi"
readme = "README.md"
keywords = ["point-cloud", "pcd", "mesh", "viewer", "thumbnailer"]
categories = ["graphics", "visualization", "command-line-utilities"]
exclude = ["docs/", "fuzz/", ".github/", "packaging/", "scripts/"]

[dependencies]
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland", "x11"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
# no "window": it pins winit 0.28, whose title bar GNOME at scale 2 rejects
three-d = { version = "0.19", default-features = false, features = ["egui-gui"] }
three-d-asset = { version = "0.10", features = ["gltf", "obj", "stl", "data-url", "png", "jpeg"] }
monstertruck-assembly = "0.4.1"
monstertruck-io = "0.4.1"
monstertruck-meshing = "0.4.1"
winit = "0.30"
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"
clap_complete = "4.6.11"
thiserror = "2"
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

# `packaging/deb/build.sh`; same files as the PKGBUILD's package(). target/assets
# is `tridi generate`'s output: man pages and completions
[package.metadata.deb]
maintainer = "Rocco Caccioppoli <caccioppolirocco@gmail.com>"
extended-description = "Point cloud and mesh viewer, with Nautilus thumbnails."
section = "graphics"
# GL/EGL, Wayland and xkbcommon are dlopened at runtime: no shlibdeps
depends = "libc6 (>= 2.34), libgcc-s1, libegl1, libgl1-mesa-dri, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0, xdg-utils"
maintainer-scripts = "packaging/deb/"
assets = [
    ["target/release/tridi", "usr/bin/", "755"],
    ["share/thumbnailers/tridi.thumbnailer", "usr/share/thumbnailers/", "644"],
    ["share/mime/packages/tridi.xml", "usr/share/mime/packages/", "644"],
    ["share/applications/io.github.rccnroll.tridi.desktop", "usr/share/applications/", "644"],
    ["share/metainfo/io.github.rccnroll.tridi.metainfo.xml", "usr/share/metainfo/", "644"],
    ["share/icons/**/*", "usr/share/icons/", "644"],
    ["LICENSE-MIT", "usr/share/doc/tridi/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/tridi/", "644"],
    ["packaging/licenses/egui-fonts/*", "usr/share/doc/tridi/egui-fonts/", "644"],
    ["target/assets/*.1", "usr/share/man/man1/", "644"],
    ["target/assets/tridi.bash", "usr/share/bash-completion/completions/tridi", "644"],
    ["target/assets/_tridi", "usr/share/zsh/vendor-completions/", "644"],
    ["target/assets/tridi.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

# The lint policy: no panics, no silent
# casts, no unexplained exceptions; the only escape is a scoped
# #[expect(lint, reason = "...")].
[lints.rust]
unused_must_use = "deny"
unused_imports  = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

# override in pedantic
missing_errors_doc                   = "allow"
must_use_candidate                   = "deny"

# individual items from the `restrictions` group

absolute_paths                       = "warn"
allow_attributes                     = "deny"
allow_attributes_without_reason      = "deny"
as_conversions                       = "deny"
assertions_on_result_states          = "deny"
cfg_not_test                         = "deny"
clone_on_ref_ptr                     = "warn"
create_dir                           = "deny"
dbg_macro                            = "warn"
doc_include_without_cfg              = "deny"
else_if_without_else                 = "allow"
empty_drop                           = "deny"
empty_enum_variants_with_brackets    = "deny"
empty_structs_with_brackets          = "deny"
error_impl_error                     = "warn"
exit                                 = "deny"
expect_used                          = "deny"
field_scoped_visibility_modifiers    = "allow"
filetype_is_file                     = "warn"
float_cmp_const                      = "deny"
if_then_some_else_none               = "deny"
implicit_clone                       = "warn"
impl_trait_in_params                 = "warn"
indexing_slicing                     = "deny"
infinite_loop                        = "deny"
integer_division                     = "warn"
items_after_test_module              = "allow"
iter_over_hash_type                  = "warn"
large_include_file                   = "warn"
let_underscore_must_use              = "warn"
lossy_float_literal                  = "warn"
map_err_ignore                       = "warn"
map_with_unused_argument_over_ranges = "warn"
mem_forget                           = "deny"
missing_assert_message               = "warn"
missing_docs_in_private_items        = "allow"
module_name_repetitions              = "allow"
mutex_atomic                         = "deny"
mutex_integer                        = "deny"
non_zero_suggestions                 = "warn"
panic                                = "deny"
partial_pub_fields                   = "warn"
pathbuf_init_then_push               = "warn"
print_stdout                         = "deny"
pub_use                              = "allow"
pub_without_shorthand                = "warn"
rc_buffer                            = "warn"
rc_mutex                             = "warn"
redundant_test_prefix                = "deny"
redundant_type_annotations           = "warn"
renamed_function_params              = "warn"
rest_pat_in_fully_bound_structs      = "warn"
return_and_then                      = "warn"
same_name_method                     = "deny"
string_lit_chars_any                 = "deny"
string_slice                         = "warn"
str_to_string                        = "deny"
tests_outside_test_module            = "deny"
todo                                 = "deny"
undocumented_unsafe_blocks           = "deny"
unimplemented                        = "deny"
unnecessary_safety_comment           = "warn"
unnecessary_safety_doc               = "warn"
unneeded_field_pattern               = "deny"
unreachable                          = "deny"
unseparated_literal_suffix           = "deny"
unused_result_ok                     = "warn"
unwrap_in_result                     = "deny"
unwrap_used                          = "deny"
use_debug                            = "warn"
verbose_file_reads                   = "warn"
wildcard_enum_match_arm              = "warn"
doc_overindented_list_items          = "allow"

