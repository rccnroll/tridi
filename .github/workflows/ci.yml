name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # OpenCASCADE's headers and libraries (7.6 on 24.04)
  OCCT: libocct-data-exchange-dev libocct-ocaf-dev libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-foundation-dev

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # the thumbnail test renders on Mesa's llvmpipe through EGL; OpenCASCADE reads STEP
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri ${{ env.OCCT }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # the oldest Rust Cargo.toml's rust-version promises
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      # build.rs builds the STEP side against OpenCASCADE
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.OCCT }}
      - run: cargo check --locked
