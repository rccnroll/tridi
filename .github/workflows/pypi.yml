name: PyPI

# A published release sends its wheel to PyPI, through trusted publishing:
# no token, PyPI trusts this workflow in the pypi environment.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --pattern '*.whl' --dir dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
